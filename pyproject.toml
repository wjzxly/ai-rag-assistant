[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rag-assistant"
version = "0.1.0"
description = "本地文档 RAG 问答：混合检索（BM25 + 向量，RRF 融合）+ 引用溯源，核心零依赖"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wjzxly" }]
keywords = ["rag", "retrieval", "bm25", "vector-search", "llm", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心检索链路只用标准库：clone 下来不装任何依赖就能 ingest / search / eval
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
